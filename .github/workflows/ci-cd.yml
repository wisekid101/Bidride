name: BidRide CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  AWS_REGION: us-east-1

jobs:
  # ─── Lint & Type Check ─────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bidride/database exec prisma generate
      # Bounded explicitly: Phase 1 gave every package a second tsc project
      # (tsconfig.spec.json, which type-checks spec files), so this job now runs
      # two tsc passes per package. Turbo's default concurrency of 10 against a
      # small hosted runner is the same OOM shape that crashed local dev.
      - run: pnpm turbo run lint typecheck --concurrency=2

  # ─── Unit Tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bidride/database exec prisma generate
      # No --filter here: the previous './services/*' filter meant
      # apps/rider-app, apps/driver-app, and packages/observability (the
      # heaviest suites, all jest-expo/jest) never ran in CI. `pnpm test:ci`
      # runs every workspace's `test` task with an explicit, GitHub-hosted-
      # runner-sized bound (turbo --concurrency=2, jest --maxWorkers=2) so
      # this never relies on CPU-derived defaults, which is what OOM-crashed
      # local dev machines. See scripts/dev/test-concurrency.mjs.
      - run: pnpm test:ci
        env:
          NODE_ENV: test
      - uses: codecov/codecov-action@v4
        with: { token: '${{ secrets.CODECOV_TOKEN }}' }

  # ─── Integration Tests ─────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bidride_test
          POSTGRES_USER: bidride
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bidride/database exec prisma generate
      - name: Run DB migrations
        run: pnpm db:migrate:prod
        env:
          DATABASE_URL: postgresql://bidride:test_password@localhost:5432/bidride_test
      - name: Integration tests
        # Explicit, GitHub-hosted-runner-sized bound, same rationale as the
        # unit-tests job: never rely on CPU-derived turbo/jest defaults.
        # DB/redis service containers above are unchanged.
        run: pnpm turbo run test:int --concurrency=2 -- --maxWorkers=2
        env:
          DATABASE_URL: postgresql://bidride:test_password@localhost:5432/bidride_test
          REDIS_URL: redis://localhost:6379
          TEST_DATABASE_URL: postgresql://bidride:test_password@localhost:5432/bidride_test
          TEST_REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_for_ci_only
          NODE_ENV: test
          # Required by the cross-service E2E suite, whose services run with the
          # internal-key guard failing closed. Value is CI-only.
          INTERNAL_SERVICE_KEY: internal_service_key_for_ci_only

  # ─── Build Docker Images ───────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service:
          - auth-service
          - trip-service
          - driver-service
          - rider-service
          - pricing-service
          - safety-service
          - payment-service
          - notification-service
          - trust-service
          - airport-service
          - admin-service
          - ai-service

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # :$IMAGE_TAG is the deployable artefact — immutable, one per commit.
      # :latest is pushed ONLY as a Docker layer cache source and is never
      # deployed from: deploy-service.sh resolves :$IMAGE_TAG to its sha256
      # digest and pins the task definition to that digest.
      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker build \
            -f services/Dockerfile.template \
            --build-arg SERVICE_NAME=$SERVICE \
            -t $ECR_REGISTRY/bidride/$SERVICE:$IMAGE_TAG \
            -t $ECR_REGISTRY/bidride/$SERVICE:latest \
            --cache-from $ECR_REGISTRY/bidride/$SERVICE:latest \
            .
          docker push $ECR_REGISTRY/bidride/$SERVICE:$IMAGE_TAG
          docker push $ECR_REGISTRY/bidride/$SERVICE:latest

      - name: Record the immutable digest
        env:
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "bidride/$SERVICE" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "$SERVICE $IMAGE_TAG $DIGEST"
          [ "${DIGEST#sha256:}" != "$DIGEST" ] || { echo "no digest for $SERVICE:$IMAGE_TAG"; exit 1; }

  # ─── Deploy Staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run database migrations
        run: |
          aws ecs run-task \
            --cluster bidride-staging \
            --task-definition bidride-auth-service-staging \
            --launch-type FARGATE \
            --overrides '{"containerOverrides":[{"name":"auth-service","command":["node","node_modules/.bin/prisma","migrate","deploy","--schema","packages/database/prisma/schema.prisma"]}]}' \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP }}],assignPublicIp=DISABLED}"
      # Deploys BY EXPLICIT TASK-DEFINITION ARN, one service at a time, each
      # verified before the next starts.
      #
      # The previous step here was `update-service --force-new-deployment` with
      # no --task-definition. Because every ECS service carries
      # `ignore_changes = [task_definition]`, that restarted tasks on the
      # revision the service was ALREADY pinned to — so task-definition changes
      # (new secrets, new environment variables) never reached staging, and the
      # job still reported success. See infrastructure/DEPLOYMENT_RUNBOOK.md §9.
      - name: Deploy fleet (explicit revision, ordered, gated)
        run: |
          bash infrastructure/scripts/deploy-fleet.sh staging "${{ github.sha }}"

      - name: Upload rollback records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-records-staging-${{ github.sha }}
          path: infrastructure/deploy-records/staging/
          retention-days: 30
          if-no-files-found: warn

      - name: Deployment verification (configuration, not just liveness)
        run: |
          bash infrastructure/scripts/verify-deployment.sh staging all

      - name: Smoke tests
        run: |
          BIDRIDE_API_URL=https://staging-api.bidiride.com bash infrastructure/scripts/smoke-test.sh

  # ─── Deploy Production ─────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production  # Requires manual approval in GitHub Environments
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pre-migration RDS snapshot
        run: |
          aws rds create-db-snapshot \
            --db-instance-identifier bidride-production \
            --db-snapshot-identifier bidride-pre-deploy-${{ github.sha }}

      - name: Run database migrations
        run: |
          aws ecs run-task \
            --cluster bidride-production \
            --task-definition bidride-auth-service-production \
            --launch-type FARGATE \
            --overrides '{"containerOverrides":[{"name":"auth-service","command":["node","node_modules/.bin/prisma","migrate","deploy","--schema","packages/database/prisma/schema.prisma"]}]}' \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PROD_PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.PROD_ECS_SECURITY_GROUP }}],assignPublicIp=DISABLED}"

      # Record what is live BEFORE anything moves. deploy-service.sh writes a
      # per-service record too, but this snapshot survives even a failure that
      # happens before the first service is touched.
      - name: Snapshot current revisions (rollback targets)
        run: |
          mkdir -p infrastructure/deploy-records/production
          for service in auth-service trip-service driver-service rider-service pricing-service \
                         safety-service payment-service notification-service trust-service \
                         airport-service admin-service ai-service; do
            arn=$(aws ecs describe-services --cluster bidride-production \
              --services "bidride-${service}-production" \
              --query 'services[0].taskDefinition' --output text)
            echo "${service} ${arn}"
          done | tee infrastructure/deploy-records/production/pre-deploy-${{ github.sha }}.txt

      # Ordered, gated, one service at a time, deployed BY EXPLICIT ARN with a
      # digest-pinned image. Verifiers roll before the token issuers, so no
      # token ever exists that some verifier cannot check.
      - name: Deploy fleet (explicit revision, ordered, gated)
        run: |
          bash infrastructure/scripts/deploy-fleet.sh production "${{ github.sha }}"

      - name: Upload rollback records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-records-production-${{ github.sha }}
          path: infrastructure/deploy-records/production/
          retention-days: 90
          if-no-files-found: warn

      - name: Deployment verification (configuration, not just liveness)
        run: |
          bash infrastructure/scripts/verify-deployment.sh production all

      - name: Production smoke tests
        run: |
          BIDRIDE_API_URL=https://api.bidiride.com bash infrastructure/scripts/smoke-test.sh

      - name: Notify on success
        if: success()
        run: |
          echo "Production deploy succeeded: ${{ github.sha }}"

      # A bare `echo` on failure is not a notification. Publish to the same SNS
      # topic the CloudWatch alarms use, so a failed deploy reaches the Founder
      # through the channel already being watched.
      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deploy FAILED: ${{ github.sha }}"
          TOPIC=$(aws sns list-topics \
            --query "Topics[?ends_with(TopicArn, ':bidride-alerts-production')].TopicArn | [0]" \
            --output text 2>/dev/null || echo "None")
          if [ "$TOPIC" != "None" ] && [ -n "$TOPIC" ]; then
            # printf, not a heredoc: bash's $( ) parser scans for quotes before
            # honouring a heredoc, so an apostrophe in heredoc text inside a
            # command substitution is a syntax error at runtime.
            MSG=$(printf '%s\n' \
              "Commit: ${{ github.sha }}" \
              "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "" \
              "The fleet deploy halted. Services deploy one at a time, so some may" \
              "be on the new revision and some on the old. Rollback targets are in" \
              "this run deploy-records artifact." \
              "" \
              "  bash infrastructure/scripts/rollback-service.sh production SERVICE")
            aws sns publish --topic-arn "$TOPIC" \
              --subject "BidRide production deploy FAILED" \
              --message "$MSG" || true
          fi
          exit 1
